<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BA | Stamp — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080c12;
      color: #e4e4e7;
      padding: 40px 24px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 .pipe { color: #5eead4; }
    .sub {
      font-size: 13px;
      color: #8a8f98;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a8f98;
      margin-bottom: 8px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #0f1419;
      border: 1px solid #1e1e24;
      color: #e4e4e7;
      font-size: 13px;
      font-family: ui-monospace, "Cascadia Code", monospace;
    }
    input:focus {
      outline: none;
      border-color: #5eead4;
    }
    .help {
      font-size: 12px;
      color: #52525b;
      margin-top: 10px;
      line-height: 1.6;
    }
    .help a { color: #5eead4; text-decoration: none; }
    .help a:hover { text-decoration: underline; }
    button {
      margin-top: 24px;
      padding: 12px 26px;
      background: #5eead4;
      color: #080c12;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: none;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    #saved {
      margin-left: 12px;
      font-size: 12px;
      color: #5eead4;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #saved.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>BA <span class="pipe">|</span> Stamp — Settings</h1>
  <p class="sub">Configure your bastamp.com API key. Stored locally in your browser — never sent anywhere except bastamp.com.</p>

  <label for="apikey">API key</label>
  <input id="apikey" type="password" placeholder="ba_live_…" autocomplete="off">
  <p class="help">
    Create one at <a href="https://bastamp.com/account/api-keys" target="_blank" rel="noopener">bastamp.com/account/api-keys</a>.
    Each stamp uses one credit from your account.
  </p>

  <div>
    <button id="save">Save</button>
    <span id="saved">Saved</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
