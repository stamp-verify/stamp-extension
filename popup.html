<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BA | Stamp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">BA <span class="brand-pipe">|</span> STAMP</span>
  </header>

  <main>
    <div id="target">
      <div class="target-label">Page to stamp</div>
      <div class="target-url" id="target-url">—</div>
    </div>

    <button id="stamp-btn" class="primary">Stamp this page</button>

    <div id="status" class="status hidden"></div>
    <div id="result" class="result hidden">
      <div class="result-title">Stamped</div>
      <div class="result-row"><span>Hash</span><code id="result-hash"></code></div>
      <div class="result-row"><a id="result-link" target="_blank" rel="noopener">View on bastamp.com →</a></div>
      <div class="result-row muted">Bundle saved to your Downloads folder. Keep it — you'll need it to verify the stamp later.</div>
    </div>
  </main>

  <footer>
    <a href="#" id="open-options">Settings</a>
    <span class="dot">·</span>
    <a href="https://bastamp.com" target="_blank" rel="noopener">bastamp.com</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
